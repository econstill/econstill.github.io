name: Theory Watch and website
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/theory-watch-semantic
      - name: Retrieve evaluated metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 38571494354 --repo econstill/econstill.github.io --name theory-watch-evaluation --dir result
      - name: Stage public preview data for review
        run: |
          mkdir -p evaluation
          cp result/site/theory-watch/papers.json evaluation/papers.json
          cp result/results/decisions.json evaluation/decisions.json
          git add -- evaluation
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Save evaluated Theory Watch metadata for review'
          git push origin HEAD:codex/theory-watch-semantic

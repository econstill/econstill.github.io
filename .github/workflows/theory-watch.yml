name: Theory Watch and website
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  models:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install huggingface-hub==1.0.1
      - name: Download public inference models
        run: |
          python - <<'PY'
          from huggingface_hub import HfApi, hf_hub_download
          import json
          from pathlib import Path
          models = [('sentence-transformers/all-MiniLM-L6-v2', 'minilm'), ('cross-encoder/nli-deberta-v3-xsmall', 'nli')]
          metadata = {}
          for repo, directory in models:
              info = HfApi().model_info(repo)
              files = [file.rfilename for file in info.siblings]
              print(repo, info.sha, files, flush=True)
              metadata[directory] = {'repo': repo, 'revision': info.sha, 'files': files}
              for filename in files:
                  if '/' not in filename and (filename.endswith('.json') or filename.endswith('.model') or filename == 'vocab.txt') or filename == 'onnx/model_quint8_avx2.onnx':
                      hf_hub_download(repo, filename, revision=info.sha, local_dir='models/' + directory)
          Path('models/manifest.json').write_text(json.dumps(metadata, indent=2))
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: theory-watch-public-models
          path: models
          retention-days: 2

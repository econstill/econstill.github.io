name: Theory Watch and website

on:
  schedule:
    - cron: '17 0 * * *'
  workflow_dispatch:
  push:
    branches: [gh-pages]

concurrency:
  group: website-and-theory-watch
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - name: Check out collector
        uses: actions/checkout@v7
        with:
          ref: main
          path: automation
          persist-credentials: false
      - name: Check out current website
        uses: actions/checkout@v7
        with:
          ref: gh-pages
          path: site
      - name: Set up Python
        if: github.event_name != 'push'
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Check collector
        if: github.event_name != 'push'
        run: python -m unittest discover -s automation/tools/theory_watch -p 'test_*.py'
      - name: Install semantic screening runtime
        if: github.event_name != 'push'
        run: pip install -r automation/tools/theory_watch/requirements.txt
      - name: Restore public models and screening cache
        if: github.event_name != 'push'
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/huggingface/hub
            .cache/theory-watch
          key: theory-watch-${{ runner.os }}-${{ hashFiles('automation/tools/theory_watch/semantic.json') }}-${{ github.run_id }}
          restore-keys: |
            theory-watch-${{ runner.os }}-${{ hashFiles('automation/tools/theory_watch/semantic.json') }}-
      - name: Collect and render papers
        if: github.event_name != 'push'
        env:
          CROSSREF_MAILTO: stillwang@bjtu.edu.cn
        run: python automation/tools/theory_watch/update.py --site-dir site --review-output review/pending.json
      - name: Save unselected discovery candidates for review
        if: github.event_name != 'push'
        uses: actions/upload-artifact@v7
        with:
          name: theory-watch-review
          path: review
          retention-days: 30
      - name: Save archive
        if: github.event_name != 'push'
        working-directory: site
        run: |
          git add -- theory-watch
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Update Theory Watch archive'
            git push origin HEAD:gh-pages
          fi
      - name: Package website
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v5

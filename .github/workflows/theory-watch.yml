name: Theory Watch and website
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/theory-watch-semantic
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install -r tools/theory_watch/requirements.txt
      - name: Check real-paper regression cases
        run: |
          python - <<'PY'
          import json, sys
          from pathlib import Path
          sys.path.insert(0, 'tools/theory_watch')
          import semantic, update
          cases = json.loads(Path('tools/theory_watch/validation_cases.json').read_text())
          works = []
          for key in ('theory', 'not_theory'):
              for identifier in cases[key]:
                  works.append(update.request_json('https://api.crossref.org/works/10.2139/ssrn.' + identifier)['message'])
          selector = semantic.SemanticSelector('.cache/decisions.json')
          selector.prepare(works)
          for work in works:
              doi = work['DOI'].lower()
              print('RESULT ' + json.dumps({'doi': doi, 'title': update.plain(' '.join(work.get('title') or [])), **selector.decisions[doi]}))
          PY
